<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moon-egui | 百万矩形压测实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: rgba(255, 255, 255, 0.94);
      --border: rgba(226, 232, 240, 0.9);
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-violet: #7c3aed;
      --brand-emerald: #10b981;
      --brand-cyan: #0284c7;
      --segment-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen Infinite Canvas */
    #moon-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
      z-index: 1;
    }

    /* Top Floating Studio Header Bar */
    .studio-header {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      gap: 12px;
      max-width: calc(100vw - 32px);
      white-space: nowrap;
    }

    .studio-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .back-btn:hover {
      color: var(--text-main);
      background: var(--segment-bg);
    }

    .studio-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .studio-badge {
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      padding: 1px 6px;
      background: var(--segment-bg);
      color: var(--text-muted);
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Segmented Controls */
    .controls-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .segmented-control {
      display: flex;
      align-items: center;
      background: var(--segment-bg);
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .seg-btn {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn:hover {
      color: var(--text-main);
    }

    .seg-btn.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* Right Telemetry & Language Toggle */
    .studio-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .telemetry-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--segment-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .fps-metric {
      color: var(--brand-emerald);
      font-weight: 700;
    }

    .kernel-metric {
      color: var(--brand-cyan);
    }

    .lang-toggle-btn {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-toggle-btn:hover {
      color: var(--text-main);
      border-color: var(--border-strong);
      background: var(--segment-bg);
    }

    /* Floating Bottom Info Pill */
    .studio-footer-pill {
      position: fixed;
      bottom: 14px;
      left: 64px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 12px;
      background: var(--surface);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      font-size: 11px;
      color: var(--text-muted);
    }

    .shortcuts-list {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .shortcut-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .kbd {
      padding: 1px 4px;
      background: #ffffff;
      border: 1px solid var(--border-strong);
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    .hud-coords {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      border-left: 1px solid var(--border);
      padding-left: 10px;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Fullscreen Canvas -->
  <canvas id="moon-canvas" data-initial-mode="1"></canvas>

  <!-- Top Floating Studio Header -->
  <header class="studio-header">
    <!-- Left: Brand & Home Link -->
    <div class="studio-left">
      <a href="index.html" class="back-btn" id="lbl-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span id="txt-back">返回官网</span>
      </a>
      <div class="studio-title">
        <span>moon-egui</span>
        <span class="studio-badge" id="txt-title">百万矩形实验室</span>
      </div>
    </div>

    <!-- Center: Segmented Controls -->
    <div class="controls-center">
      <!-- Entity Morph -->
      <div class="segmented-control" id="seg-entity">
        <button class="seg-btn active" id="btn-rect" onclick="setEntity('rect')">1,000,000 矩形</button>
        <button class="seg-btn" id="btn-logo" onclick="setEntity('logo')">Logo矩阵</button>
      </div>

      <!-- Interaction Mode -->
      <div class="segmented-control" id="seg-interact">
        <button class="seg-btn active" id="btn-pan" onclick="setInteract('pan')">漫游画布</button>
        <button class="seg-btn" id="btn-drag" onclick="setInteract('drag')">拖拽物体</button>
      </div>

      <!-- Camera View -->
      <div class="segmented-control" id="seg-view">
        <button class="seg-btn" id="btn-center" onclick="setView('center')">居中</button>
        <button class="seg-btn" id="btn-fit" onclick="setView('fit')">适应全屏</button>
        <button class="seg-btn" id="btn-100" onclick="setView('scale100')">100%</button>
      </div>
    </div>

    <!-- Right: Telemetry & Single Language Switch -->
    <div class="studio-right">
      <div class="telemetry-capsule">
        <span class="fps-metric"><span id="telemetry-fps">60.0</span> FPS</span>
        <span>·</span>
        <span class="kernel-metric"><span id="telemetry-kernel">0.10 ms</span></span>
        <span>·</span>
        <span id="txt-nodes">1,000,000 矩形</span>
      </div>
      <button class="lang-toggle-btn" id="btn-lang-toggle" onclick="toggleLanguage()">EN</button>
    </div>
  </header>

  <!-- Quiet Floating Bottom Pill -->
  <div class="studio-footer-pill">
    <div class="shortcuts-list" id="txt-shortcuts">
      <span class="shortcut-item"><span class="kbd">拖拽</span> 漫游或位移</span>
      <span class="shortcut-item"><span class="kbd">滚轮</span> 缩放视角</span>
      <span class="shortcut-item"><span class="kbd">点击</span> 选中矩形</span>
    </div>
    <div class="hud-coords">
      <span id="telemetry-coords">(0, 0)</span>
    </div>
  </div>

  <!-- WebAssembly / MoonBit Host -->
  <script src="canvas.js"></script>
  <script src="run.js"></script>

  <!-- Lightweight Studio Controller & Pure i18n -->
  <script>
    const I18N = {
      zh: {
        back: '返回官网',
        title: '百万矩形实验室',
        rect: '1,000,000 矩形',
        logo: 'Logo矩阵',
        pan: '漫游画布',
        drag: '拖拽物体',
        center: '居中',
        fit: '适应全屏',
        scale100: '100%',
        nodes: '1,000,000 矩形',
        shortcuts: [
          '<span class="shortcut-item"><span class="kbd">拖拽</span> 漫游或位移</span>',
          '<span class="shortcut-item"><span class="kbd">滚轮</span> 缩放视角</span>',
          '<span class="shortcut-item"><span class="kbd">点击</span> 选中矩形</span>'
        ].join(''),
        langBtn: 'EN'
      },
      en: {
        back: 'Back',
        title: '1,000,000 Rectangles Lab',
        rect: '1,000,000 Rects',
        logo: 'Logo Matrix',
        pan: 'Pan Canvas',
        drag: 'Drag Item',
        center: 'Center',
        fit: 'Fit View',
        scale100: '100%',
        nodes: '1,000,000 Rectangles',
        shortcuts: [
          '<span class="shortcut-item"><span class="kbd">Drag</span> Pan / Move</span>',
          '<span class="shortcut-item"><span class="kbd">Wheel</span> Zoom View</span>',
          '<span class="shortcut-item"><span class="kbd">Click</span> Select Rect</span>'
        ].join(''),
        langBtn: '中'
      }
    };

    let currentLang = 'zh';

    function applyLanguage(lang) {
      currentLang = lang;
      const t = I18N[lang];
      document.getElementById('txt-back').textContent = t.back;
      document.getElementById('txt-title').textContent = t.title;
      document.getElementById('btn-rect').textContent = t.rect;
      document.getElementById('btn-logo').textContent = t.logo;
      document.getElementById('btn-pan').textContent = t.pan;
      document.getElementById('btn-drag').textContent = t.drag;
      document.getElementById('btn-center').textContent = t.center;
      document.getElementById('btn-fit').textContent = t.fit;
      document.getElementById('btn-100').textContent = t.scale100;
      document.getElementById('txt-nodes').textContent = t.nodes;
      document.getElementById('txt-shortcuts').innerHTML = t.shortcuts;
      document.getElementById('btn-lang-toggle').textContent = t.langBtn;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    }

    function toggleLanguage() {
      applyLanguage(currentLang === 'zh' ? 'en' : 'zh');
    }

    function setEntity(type) {
      document.querySelectorAll('#seg-entity .seg-btn').forEach(b => b.classList.remove('active'));
      if (type === 'rect') {
        document.getElementById('btn-rect').classList.add('active');
        if (window.triggerBenchmarkAction) window.triggerBenchmarkAction('rect');
      } else if (type === 'logo') {
        document.getElementById('btn-logo').classList.add('active');
        if (window.triggerBenchmarkAction) window.triggerBenchmarkAction('logo');
      }
    }

    function setInteract(mode) {
      document.querySelectorAll('#seg-interact .seg-btn').forEach(b => b.classList.remove('active'));
      if (mode === 'pan') {
        document.getElementById('btn-pan').classList.add('active');
        if (window.triggerBenchmarkAction) window.triggerBenchmarkAction('move');
      } else if (mode === 'drag') {
        document.getElementById('btn-drag').classList.add('active');
        if (window.triggerBenchmarkAction) window.triggerBenchmarkAction('drag');
      }
    }

    function setView(action) {
      if (window.triggerBenchmarkAction) window.triggerBenchmarkAction(action);
    }
  </script>
</body>
</html>
